<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Zenoxi.hu | New Home</title>
  <meta http-equiv="refresh" content="12; url=https://www.zenoxi.hu" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Oxanium:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-0:#060816;
      --bg-1:#07182f;
      --bg-2:#091f3b;
      --line:rgba(124,247,255,0.2);
      --text:#f4fbff;
      --muted:rgba(244,251,255,0.76);
      --cyan:#77f7ff;
      --pink:#ff7fd1;
      --gold:#ffd36e;
      --shadow:0 20px 70px rgba(0,0,0,0.45);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Space Grotesk",sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 15% 12%, rgba(119,247,255,0.16), transparent 50%),
        radial-gradient(700px 480px at 85% 18%, rgba(255,127,209,0.14), transparent 48%),
        radial-gradient(800px 620px at 50% 88%, rgba(255,211,110,0.12), transparent 55%),
        linear-gradient(135deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
      display:grid;
      place-items:center;
      overflow:hidden;
      padding:18px;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size:72px 72px;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 90%);
      pointer-events:none;
      opacity:0.4;
    }

    .shell{
      position:relative;
      width:min(860px, 100%);
      border:1px solid var(--line);
      border-radius:32px;
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px) saturate(125%);
      overflow:hidden;
      isolation:isolate;
      animation:rise .7s ease-out both;
    }

    .shell::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg, rgba(119,247,255,0.08), transparent 24%, rgba(255,127,209,0.05) 60%, transparent 74%);
      pointer-events:none;
    }

    .panel{
      position:relative;
      z-index:1;
      padding:clamp(24px, 4vw, 50px);
      display:grid;
      gap:18px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      width:fit-content;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(119,247,255,0.24);
      background:rgba(8,19,37,0.62);
      color:var(--muted);
      font-size:0.84rem;
      letter-spacing:0.08em;
      text-transform:uppercase;
    }

    .eyebrow::before{
      content:"";
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--cyan);
      box-shadow:0 0 18px var(--cyan);
    }

    h1,p{margin:0}

    h1{
      font-family:"Oxanium",sans-serif;
      font-size:clamp(2.2rem, 6.6vw, 4.6rem);
      line-height:0.95;
      letter-spacing:-0.04em;
      max-width:12ch;
    }

    .neon{
      color:transparent;
      -webkit-background-clip:text;
      background-clip:text;
      background-image:linear-gradient(90deg, var(--cyan), var(--pink), var(--gold), var(--cyan));
      background-size:280% 100%;
      animation:shine 8s linear infinite;
    }

    .lead{
      font-size:clamp(1rem, 2vw, 1.2rem);
      line-height:1.8;
      color:var(--muted);
      max-width:58ch;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:8px;
    }

    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:12px 18px;
      border-radius:999px;
      border:1px solid rgba(124,247,255,0.2);
      background:linear-gradient(180deg, rgba(124,247,255,0.16), rgba(124,247,255,0.06));
      color:var(--text);
      text-decoration:none;
      font-weight:700;
      transition:transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .button:hover{
      transform:translateY(-1px);
      border-color:rgba(255,127,209,0.3);
      background:linear-gradient(180deg, rgba(255,127,209,0.14), rgba(124,247,255,0.06));
    }

    .subtle-link{
      color:var(--muted);
      text-decoration:none;
      border-bottom:1px dashed rgba(244,251,255,0.36);
      padding-bottom:2px;
    }

    .subtle-link:hover{color:var(--text)}

    .hint{
      color:var(--muted);
      font-size:0.94rem;
      line-height:1.6;
    }

    @keyframes shine{
      0%{background-position:0% 50%}
      100%{background-position:280% 50%}
    }

    @keyframes rise{
      0%{transform:translateY(12px); opacity:0}
      100%{transform:translateY(0); opacity:1}
    }

    @media (max-width: 640px){
      .shell{border-radius:24px}
      .panel{padding:22px}
    }
  </style>
</head>
<body>
  <main class="shell" aria-labelledby="page-title">
    <section class="panel">
      <div class="eyebrow">Zenoxi Update</div>
      <h1 id="page-title">Welcome to <span class="neon">bodizeno.github.io</span></h1>
      <p class="lead">
        This is Zenoxi's old site. I've moved to a newer, better place.
        Please continue on the official hosted website.
      </p>
      <div class="actions">
        <a class="button" href="https://www.zenoxi.hu" target="_self" rel="noopener">Go to Official www.zenoxi.hu</a>
      </div>
      <p class="hint">You will be redirected automatically in a few seconds.</p>
    </section>
  </main>
</body>
</html>
